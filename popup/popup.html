<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>镜像快车道</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    width: 300px; margin: 0; padding: 14px 16px 12px;
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #ffffff; color: #1f2328;
  }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #8b949e; }
  .dot.on { background: #1a7f37; }
  .dot.warn { background: #bf8700; }
  .dot.off { background: #cf222e; }
  .card { border: 1px solid #d0d7de; border-radius: 8px; padding: 10px 12px; background: #f6f8fa; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; }
  .row + .row { border-top: 1px solid #d8dee4; margin-top: 4px; padding-top: 7px; }
  .muted { color: #57606a; font-size: 12px; }
  .val { font-weight: 600; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1; padding: 7px 10px; font-size: 12.5px; cursor: pointer;
    border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; color: #1f2328;
  }
  button:hover { background: #eaeef2; }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.primary:hover { background: #1a5fd0; }
  .switch { display: flex; align-items: center; gap: 8px; }
  .hint { margin-top: 10px; font-size: 11.5px; color: #57606a; }

  /* 深色：必须放在最后。放前面会被后面的同名规则按"后来居上"覆盖掉——
     之前就是这样，按钮还是浅底，配上继承来的浅色文字，等于白底白字。 */
  @media (prefers-color-scheme: dark) {
    body { background: #1c2128; color: #e6edf3; }
    .card { background: #22272e; border-color: #30363d; }
    .row + .row { border-color: #30363d; }
    .muted { color: #8b949e; }
    .hint { color: #8b949e; }
    button { background: #2d333b; border-color: #444c56; color: #e6edf3; }
    button:hover { background: #373e47; }
    button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    button.primary:hover { background: #2d7ff0; }
  }
</style>
</head>
<body>
  <h1><span id="dot" class="dot"></span>镜像快车道</h1>

  <div class="card">
    <div class="row">
      <span class="muted">当前镜像</span>
      <span class="val" id="best">—</span>
    </div>
    <div class="row">
      <span class="muted">规则条数</span>
      <span class="val" id="rules">—</span>
    </div>
    <div class="row">
      <span class="muted">上次测速</span>
      <span class="val" id="probe">—</span>
    </div>
    <div class="row">
      <span class="switch">
        <label for="enabled">启用改写</label>
      </span>
      <input type="checkbox" id="enabled">
    </div>
  </div>

  <div class="actions">
    <button id="open" class="primary">设置</button>
    <button id="probeNow">立即测速</button>
  </div>

  <div class="hint" id="hint"></div>

  <script src="../lib/core.js"></script>
  <script src="../lib/debug-log.js"></script>
  <script src="popup.js"></script>
</body>
</html>
