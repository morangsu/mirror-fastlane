name: test

# 纯 Node 检查 + 一次真浏览器冒烟（headless Chrome）。
# 下面这些故意不纳入，否则 CI 会长期红叉：
#   test/redirect-check.mjs / test/taskfile-e2e.mjs  → 依赖真实网络（GitHub/镜像）
#   test/run-ps-tests.mjs                            → 需要 Windows PowerShell
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # v7 起的官方 action 跑在 Node 24，与 setup-node 保持一致
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 构建三个 dist
        run: node build.mjs

      # 四个纯逻辑单测：都不依赖浏览器，也没有平台专属二进制
      - name: 纯逻辑单测
        run: |
          node test/run-tests.mjs
          node test/debug-log-test.mjs
          node test/content-state-test.mjs
          node test/refresh-mirrors-test.mjs

      # 发布体检自身的回归测试：完全在临时目录造数据，不读真实发布包
      - name: 发布体检回归
        run: node test/verify-release-test.mjs

      # runner 自带的 google-chrome 是正式版，从 137 起命令行 --load-extension 被忽略，
      # 扩展根本不会加载。Chrome for Testing 是官方给自动化用的构建，仍然允许命令行加载扩展。
      - name: 安装 Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # 冒烟在 CI 上是「顾问式」：照跑、日志可查，但不阻塞合并。
      # 原因：Chrome 157（headless 与 xvfb 有头都试过）在 runner 容器里不会把本扩展的
      # MV3 service worker 作为目标暴露出来 —— 扩展本身已通过 CDP 装好、设置页也能打开，
      # 只是冒烟靠 SW 会话做的断言没法执行。本机（Edge/Chrome 桌面版）跑仍是阻塞式。
      - name: 真浏览器冒烟（headful Chrome + Xvfb）
        continue-on-error: true
        env:
          MFL_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          MFL_HEADFUL: '1'
        run: xvfb-run -a node test/browser-smoke.mjs

      - name: 校验镜像清单 schema
        run: node tools/validate-mirrors.mjs

      # store/packages/ 被 .gitignore 忽略，CI 上不存在发布包；
      # --skip-packages 只做版本一致性 + 清单 schema，不碰 zip。
      - name: 发版体检（skip-packages）
        run: node tools/verify-release.mjs --skip-packages
